packages:
  - "."
  - "apps/*"
  - "infra"

catalog:
  "@webpresso/app-config": "0.5.1"
  vite-plus: ^0.2.1
  "@stryker-mutator/core": ^9.6.1
  "@stryker-mutator/typescript-checker": ^9.6.1
  "@stryker-mutator/vitest-runner": ^9.6.1
  typescript: ^7.0.2
  vitest: ^4.1.10

allowBuilds:
  better-sqlite3: true
  esbuild: true
  protobufjs: true
  sharp: true
  tldjs: true
  workerd: true

# Stryker core bare-imports `typescript` (undeclared) for its sandbox tsconfig
# preprocessor; under this repo's TypeScript 7 that import lacks
# ts.parseConfigFileTextToJson and every mutation run dies at startup. Inject the
# TS6 compiler-API bridge as core's own dependency so only stryker sees it.
packageExtensions:
  "@stryker-mutator/core":
    dependencies:
      typescript: npm:@typescript/typescript6@^6.0.2

# Security floors. These lived in package.json#pnpm.overrides since e9da5d4 and
# never applied: pnpm 11 reads workspace settings from THIS file, so the
# lockfile kept resolving vulnerable versions while the overrides looked
# configured. Keep them here.
overrides:
  "brace-expansion": ">=5.0.8"
  "fast-uri": ">=3.1.4"
  "js-yaml": ">=4.3.0"
  # These three still call `safeLoad`/`safeDump`, removed in js-yaml 4, so the
  # blanket floor above turns every call site into
  # `TypeError: yaml.safeLoad is not a function` (it already broke
  # `changeset version` via read-yaml-file). 3.15.1 is not a downgrade past the
  # floor's intent: OSV reports zero advisories for it, while 3.14.1 carries
  # three (GHSA-52cp-r559-cp3m, GHSA-h67p-54hq-rp68, GHSA-mh29-5h37-fv8m) — the
  # 3.15.x line is the backported-patch release, so these paths stay patched.
  "read-yaml-file>js-yaml": "3.15.1"
  "@pulumi/pulumi>js-yaml": "3.15.1"
  "@textlint/linter-formatter>js-yaml": "3.15.1"
  "postcss": ">=8.5.18"
  "tar": ">=7.5.21"
  "@vitest/browser": ">=4.1.10"
  "@opentelemetry/propagator-jaeger": ">=2.9.0"
  "sharp": ">=0.35.0"
  "protobufjs": ">=7.6.5"
