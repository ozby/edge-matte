name: Set up Webpresso tooling
description: >
  Install shared Webpresso CLIs needed by the base-kit workflow surface.
  Resolves the global wp CLI version from repo-owned catalog metadata without brittle inline shell parsing.
runs:
  using: composite
  steps:
    - name: Install shared Webpresso CLIs
      shell: bash
      run: |
        set -euo pipefail
        eval "$(node ./scripts/resolve-webpresso-cli-versions.js)"
        npm install -g "vite-plus@${VITE_PLUS_VERSION}" "@webpresso/agent-kit@${AGENT_KIT_VERSION}"
