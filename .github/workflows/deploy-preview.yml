name: Deploy preview

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
    inputs:
      lane:
        description: "Preview lane: preview-main or preview-pr-<n>"
        required: true
        type: string
      mode:
        description: "deploy or destroy"
        required: false
        default: deploy
        type: choice
        options:
          - deploy
          - destroy

concurrency:
  group: edge-matte-preview-${{ github.event.pull_request.number || github.ref_name || inputs.lane }}
  cancel-in-progress: true

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      dashed_lane: ${{ steps.resolve.outputs.dashed_lane }}
      canonical_lane: ${{ steps.resolve.outputs.canonical_lane }}
      mode: ${{ steps.resolve.outputs.mode }}
    steps:
      - name: Resolve preview lane + mode
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MANUAL_LANE: ${{ inputs.lane }}
          MANUAL_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "push" ]]; then
            dashed_lane="preview-main"
            canonical_lane="preview_main"
            mode="deploy"
          elif [[ "${EVENT_NAME}" == "pull_request" ]]; then
            dashed_lane="preview-pr-${PR_NUMBER}"
            canonical_lane="preview_pr_${PR_NUMBER}"
            if [[ "${EVENT_ACTION}" == "closed" ]]; then
              mode="destroy"
            else
              mode="deploy"
            fi
          else
            dashed_lane="${MANUAL_LANE}"
            mode="${MANUAL_MODE}"
            if [[ "${dashed_lane}" == "preview-main" ]]; then
              canonical_lane="preview_main"
            elif [[ "${dashed_lane}" =~ ^preview-pr-([0-9]+)$ ]]; then
              canonical_lane="preview_pr_${BASH_REMATCH[1]}"
            else
              echo "Invalid preview lane: ${dashed_lane}" >&2
              exit 1
            fi
          fi
          {
            printf 'dashed_lane=%s\n' "${dashed_lane}"
            printf 'canonical_lane=%s\n' "${canonical_lane}"
            printf 'mode=%s\n' "${mode}"
          } >> "$GITHUB_OUTPUT"

  deploy-preview:
    if: ${{ needs.resolve.outputs.mode == 'deploy' }}
    needs: resolve
    uses: webpresso/agent-kit/.github/workflows/cloudflare-preview.yml@c53f2f2dc6ecce7d6191193609308cc0a1fbac23
    with:
      lane: ${{ needs.resolve.outputs.canonical_lane }}
      mode: deploy
      install_command: pnpm install --frozen-lockfile
      verify_command: |
        pnpm exec vp run verify:secrets
        pnpm exec wp audit absolute-path-policy --root .
        pnpm exec wp audit no-first-party-mjs --root .
        pnpm exec vp run audit:secret-provider-quarantine
        pnpm exec vp run format:check
        pnpm exec vp run lint
        pnpm exec vp run check-types
        pnpm exec vp run build
      deploy_command: pnpm exec vp run deploy:preview -- --lane ${{ needs.resolve.outputs.dashed_lane }}
      runner: ubuntu-latest
    secrets:
      ci_secret_provider_token: ${{ secrets.DOPPLER_SERVICE_TOKEN || secrets.DOPPLER_TOKEN }}

  destroy-preview:
    if: ${{ needs.resolve.outputs.mode == 'destroy' }}
    needs: resolve
    uses: webpresso/agent-kit/.github/workflows/cloudflare-preview.yml@c53f2f2dc6ecce7d6191193609308cc0a1fbac23
    with:
      lane: ${{ needs.resolve.outputs.canonical_lane }}
      mode: destroy
      install_command: pnpm install --frozen-lockfile
      verify_command: ":"
      deploy_command: ":"
      destroy_command: pnpm exec vp run deploy:preview -- --lane ${{ needs.resolve.outputs.dashed_lane }} --destroy
      runner: ubuntu-latest
    secrets:
      ci_secret_provider_token: ${{ secrets.DOPPLER_SERVICE_TOKEN || secrets.DOPPLER_TOKEN }}
