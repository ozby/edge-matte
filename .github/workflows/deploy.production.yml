name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: edge-matte-production-deploy
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PRODUCTION_URL: https://edge-matte.ozby.dev
  HAS_DOPPLER_TOKEN: ${{ (secrets.DOPPLER_SERVICE_TOKEN != '' || secrets.DOPPLER_TOKEN != '') && '1' || '' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: "24.16.0"
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify:secrets
      - run: pnpm run verify:paths
      - run: pnpm run audit:secret-provider-quarantine
      - run: pnpm run audit:blueprint-links
      - run: pnpm run format:check
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run docs:check
      - run: pnpm run blueprints:check
      - run: pnpm run build
      - run: pnpm run test

      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install chromium + system deps
        run: pnpm --filter @edge-matte/e2e exec playwright install --with-deps chromium

      # Hermetic pre-deploy gate — no secrets, no external network.
      # IMPORTANT: always pass an explicit --suite.
      # A bare `pnpm e2e` runs ALL five suites (default = all, see
      # apps/e2e/src/agent-kit-host-adapter.ts buildExecutionPlan), and on
      # Actions CI=true un-skips shouldRunProductionSmoke (env.ts:31), which
      # would fire production-journey against live prod BEFORE wrangler deploy.
      - name: Gate — contract (HTTP) suite
        run: pnpm e2e -- --suite upload-delete-contract
      - name: Gate — smoke (HTTP) suite
        run: pnpm e2e -- --suite smoke
      - name: Gate — browser (Playwright) journey
        run: pnpm e2e -- --suite upload-delete

      - name: Upload gate artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-gate-playwright-artifacts
          path: |
            apps/e2e/playwright-report
            apps/e2e/test-results
          retention-days: 7

      - name: Inject deploy credentials from Doppler
        if: env.HAS_DOPPLER_TOKEN == '1'
        uses: dopplerhq/secrets-fetch-action@v2.0.0
        with:
          doppler-token: ${{ secrets.DOPPLER_SERVICE_TOKEN || secrets.DOPPLER_TOKEN }}
          inject-env-vars: true

      - name: Verify Cloudflare deploy credentials
        run: bash scripts/verify-cloudflare-deploy-creds.sh

      - name: Deploy Worker to edge-matte.ozby.dev
        run: pnpm --filter @edge-matte/worker exec wrangler deploy --env production

      - name: Post-deploy smoke /health
        run: bash scripts/wait-for-http.sh "${PRODUCTION_URL}/health" 24 5

      - name: Post-deploy smoke app shell
        run: bash scripts/wait-for-http.sh "${PRODUCTION_URL}/" 12 5

      - name: Post-deploy production-smoke e2e
        env:
          E2E_RUN_PRODUCTION: "1"
        run: pnpm e2e -- --suite production-smoke

      - name: Post-deploy production-journey e2e (real upload -> transform -> delete)
        env:
          E2E_RUN_PRODUCTION: "1"
        run: pnpm e2e -- --suite production-journey
