name: Security scan

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  security:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.ref != 'changeset-release/main' }}
    uses: webpresso/github-actions/.github/workflows/webpresso-security.yml@f6fc93375f4ce83c8234341ec22137f43deff148
    with:
      install_command: vp install --frozen-lockfile
      security_command: vp exec secretlint "**/*"
      runner: ubuntu-latest
