name: Deploy production

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_version:
        description: "Semver release version already committed in infra/release-metadata.production.json"
        required: true
        type: string

concurrency:
  group: edge-matte-production-deploy
  cancel-in-progress: false

jobs:
  resolve-release:
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.resolve.outputs.release_version }}
    steps:
      - name: Resolve release version
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "push" ]]; then
            release_version="${REF_NAME#v}"
          else
            release_version="${INPUT_RELEASE_VERSION}"
          fi
          if [[ ! "${release_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semantic release version: ${release_version}" >&2
            exit 1
          fi
          printf 'release_version=%s\n' "${release_version}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: resolve-release
    uses: webpresso/agent-kit/.github/workflows/cloudflare-production.yml@4ba75c74138e4bbfa2b72189e6f0a3dd05fef7a9
    with:
      install_command: vp install --frozen-lockfile
      verify_command: |
        pnpm run verify:secrets
        pnpm run verify:paths
        pnpm run audit:blueprint-links
        pnpm run format:check
        pnpm run check-types
        pnpm run lint
        pnpm run docs:check
        pnpm run blueprints:check
        wp audit architecture-drift --root .
        pnpm run verify:deploy-contract
        pnpm run build
        pnpm run test
        pnpm --filter @edge-matte/e2e exec playwright install --with-deps chromium
        pnpm run e2e -- --suite upload-delete-contract
        pnpm run e2e -- --suite smoke
        pnpm run e2e -- --suite upload-delete
        bash scripts/verify-cloudflare-deploy-creds.sh
        if [[ -n "${CF_ACCESS_CLIENT_ID:-}" || -n "${CF_ACCESS_CLIENT_SECRET:-}" ]]; then [[ -n "${CF_ACCESS_CLIENT_ID:-}" && -n "${CF_ACCESS_CLIENT_SECRET:-}" ]]; fi
      deploy_command: pnpm run deploy:production
      smoke_command: |
        bash scripts/wait-for-http.sh "https://edge-matte.ozby.dev/health" 24 5
        bash scripts/wait-for-http.sh "https://edge-matte.ozby.dev/" 12 5
        E2E_RUN_PRODUCTION=1 pnpm run e2e -- --suite production-smoke
        E2E_RUN_PRODUCTION=1 pnpm run e2e -- --suite production-journey
      release_version: ${{ needs.resolve-release.outputs.release_version }}
      runner: ubuntu-latest
    secrets:
      ci_secret_provider_token: ${{ secrets.DOPPLER_SERVICE_TOKEN || secrets.DOPPLER_TOKEN }}
