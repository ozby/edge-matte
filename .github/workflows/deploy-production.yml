name: Deploy production

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Semver release version already committed in infra/release-metadata.production.json"
        required: true
        type: string

concurrency:
  group: edge-matte-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    uses: webpresso/github-actions/.github/workflows/cloudflare-production.yml@5bbbe43e6f152b802bcce655a8dadeb661f908b5
    with:
      install_command: vp install --frozen-lockfile
      verify_command: |
        pnpm run verify:secrets
        pnpm run verify:paths
        pnpm run audit:blueprint-links
        pnpm run format:check
        pnpm run check-types
        pnpm run lint
        pnpm run docs:check
        pnpm run blueprints:check
        pnpm exec wp audit architecture-drift --root .
        pnpm run verify:deploy-contract
        pnpm run build
        pnpm run test
        pnpm --filter @edge-matte/e2e exec playwright install --with-deps chromium
        pnpm run e2e -- --suite upload-delete-contract
        pnpm run e2e -- --suite smoke
        pnpm run e2e -- --suite upload-delete
        bash infra/src/deploy/verify-cloudflare-deploy-creds.sh
        if [[ -n "${CF_ACCESS_CLIENT_ID:-}" || -n "${CF_ACCESS_CLIENT_SECRET:-}" ]]; then [[ -n "${CF_ACCESS_CLIENT_ID:-}" && -n "${CF_ACCESS_CLIENT_SECRET:-}" ]]; fi
      deploy_command: bun infra/src/deploy/deploy-production.ts --skip-smoke
      smoke_command: |
        bash infra/src/deploy/wait-for-http.sh "https://edge-matte.ozby.dev/health" 24 5
        bash infra/src/deploy/wait-for-http.sh "https://edge-matte.ozby.dev/" 12 5
        E2E_RUN_PRODUCTION=1 pnpm run e2e -- --suite production-smoke
        E2E_RUN_PRODUCTION=1 pnpm run e2e -- --suite production-journey
      release_version: ${{ inputs.release_version }}
      runner: ubuntu-latest
    secrets:
      ci_secret_provider_token: ${{ secrets.DOPPLER_SERVICE_TOKEN || secrets.DOPPLER_TOKEN }}
