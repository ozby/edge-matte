name: Deploy production

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_version:
        description: "Semver release version already committed in infra/release-metadata.production.json"
        required: true
        type: string

concurrency:
  group: edge-matte-production-deploy
  cancel-in-progress: false

jobs:
  resolve-release:
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.resolve.outputs.release_version }}
    steps:
      - name: Resolve release version
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "push" ]]; then
            release_version="${REF_NAME#v}"
          else
            release_version="${INPUT_RELEASE_VERSION}"
          fi
          if [[ ! "${release_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semantic release version: ${release_version}" >&2
            exit 1
          fi
          printf 'release_version=%s\n' "${release_version}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: resolve-release
    uses: webpresso/agent-kit/.github/workflows/cloudflare-production.yml@148039c9932de794a8449b3dff03e404b5b97839
    with:
      install_command: vp install --frozen-lockfile
      verify_command: |
        vp run verify:secrets
        wp audit absolute-path-policy --root .
        wp audit no-first-party-mjs --root .
        vp run audit:secret-provider-quarantine
        vp run audit:blueprint-links
        vp run format:check
        vp run check-types
        vp run lint
        wp audit docs-frontmatter
        wp audit blueprint-lifecycle
        wp audit architecture-drift --root .
        vp run verify:deploy-contract
        vp run build
        vp run test
        vp exec --filter @edge-matte/e2e -- playwright install --with-deps chromium
        vp run e2e -- --suite upload-delete-contract
        vp run e2e -- --suite smoke
        vp run e2e -- --suite upload-delete
        bash scripts/verify-cloudflare-deploy-creds.sh
        if [[ -n "${CF_ACCESS_CLIENT_ID:-}" || -n "${CF_ACCESS_CLIENT_SECRET:-}" ]]; then [[ -n "${CF_ACCESS_CLIENT_ID:-}" && -n "${CF_ACCESS_CLIENT_SECRET:-}" ]]; fi
      deploy_command: wp deploy --lane prd
      smoke_command: |
        bash scripts/wait-for-http.sh "https://edge-matte.ozby.dev/health" 24 5
        bash scripts/wait-for-http.sh "https://edge-matte.ozby.dev/" 12 5
        E2E_RUN_PRODUCTION=1 vp run e2e -- --suite production-smoke
        E2E_RUN_PRODUCTION=1 vp run e2e -- --suite production-journey
      release_version: ${{ needs.resolve-release.outputs.release_version }}
      runner: ubuntu-latest
    secrets:
      ci_secret_provider_token: ${{ secrets.DOPPLER_SERVICE_TOKEN || secrets.DOPPLER_TOKEN }}
