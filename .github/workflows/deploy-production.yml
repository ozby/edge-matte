name: Deploy production

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Semver release version already committed in infra/release-metadata.production.json"
        required: true
        type: string

concurrency:
  group: edge-matte-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    uses: webpresso/github-actions/.github/workflows/cloudflare-production.yml@b0464171f61f5c90b4c2082fc05954f4324d96dd
    with:
      install_command: |
        npm install -g vite-plus@0.1.24 @webpresso/agent-kit@2.1.1
        vp install --frozen-lockfile
      verify_command: |
        vp run verify:secrets
        vp run verify:paths
        vp run audit:blueprint-links
        vp run format:check
        vp run check-types
        wp lint
        wp audit docs-frontmatter
        wp audit blueprint-lifecycle
        wp audit architecture-drift --root .
        vp run verify:deploy-contract
        vp run build
        vp run test
        vp exec --filter @edge-matte/e2e -- playwright install --with-deps chromium
        vp run e2e -- --suite upload-delete-contract
        vp run e2e -- --suite smoke
        vp run e2e -- --suite upload-delete
        bash infra/src/deploy/verify-cloudflare-deploy-creds.sh
        if [[ -n "${CF_ACCESS_CLIENT_ID:-}" || -n "${CF_ACCESS_CLIENT_SECRET:-}" ]]; then [[ -n "${CF_ACCESS_CLIENT_ID:-}" && -n "${CF_ACCESS_CLIENT_SECRET:-}" ]]; fi
      deploy_command: bun infra/src/deploy/deploy-production.ts --skip-smoke
      smoke_command: |
        bash infra/src/deploy/wait-for-http.sh "https://edge-matte.ozby.dev/health" 24 5
        bash infra/src/deploy/wait-for-http.sh "https://edge-matte.ozby.dev/" 12 5
        E2E_RUN_PRODUCTION=1 vp run e2e -- --suite production-smoke
        E2E_RUN_PRODUCTION=1 vp run e2e -- --suite production-journey
      release_version: ${{ inputs.release_version }}
      secret_profile: deploy
      runner: ubuntu-latest
    secrets:
      ci_secret_provider_token: ${{ secrets.CI_SECRET_PROVIDER_TOKEN }}
