name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  packages: write
  id-token: write
  # cloudflare-preview/production request `checks: read`; a job-level
  # permissions block REPLACES defaults, so it must be granted here or the
  # entire caller fails at startup before any job is scheduled.
  checks: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_AUTH_TOKEN: ${{ github.token }}

jobs:
  release-preflight:
    name: release-preflight
    runs-on: ubuntu-latest
    outputs:
      has_version_diff: ${{ steps.version-diff.outputs.has_version_diff }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@13e7afb99c66525824db54e107d667216e795d37 # v1.14.0
        with:
          node-version: "24.16.0"
          cache: true
          run-install: false
      - uses: webpresso/github-actions/.github/actions/setup-wp@2003ca953f336efb779165f748e1ad8408565428
        with:
          version: "0.0.6"
          package-root: true
      - name: Check workflow action pins
        run: node scripts/check-workflow-action-pins.ts
      - run: vp install --frozen-lockfile
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Detect versionable release diff
        id: version-diff
        shell: bash
        run: |
          set -euo pipefail
          vp run version
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "has_version_diff=true" >> "$GITHUB_OUTPUT"
            echo "Version command produced a release diff; running shared release workflow."
          else
            echo "has_version_diff=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping shared release workflow because vp run version produced no commitable diff."
          fi

  release:
    needs: release-preflight
    if: ${{ needs.release-preflight.outputs.has_version_diff == 'true' }}
    uses: webpresso/github-actions/.github/workflows/changesets-release.yml@2003ca953f336efb779165f748e1ad8408565428
    with:
      install_command: vp install --frozen-lockfile
      version_command: vp run version
      publish_command: vp run release:publish
      runner: ubuntu-latest

  gate:
    needs:
      - release-preflight
      - release
    if: ${{ always() }}
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.release.outputs.should_deploy }}
      release_version: ${{ steps.release.outputs.release_version }}
    steps:
      - name: Resolve release result
        id: release
        shell: bash
        env:
          HAS_VERSION_DIFF: ${{ needs.release-preflight.outputs.has_version_diff }}
          RELEASE_RESULT: ${{ needs.release.result }}
          SHOULD_DEPLOY: ${{ needs.release.outputs.should_deploy }}
          RELEASE_VERSION: ${{ needs.release.outputs.release_version }}
        run: |
          set -euo pipefail
          if [[ "${HAS_VERSION_DIFF}" != "true" ]]; then
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            echo "release_version=" >> "$GITHUB_OUTPUT"
            echo "No versionable release diff; deployment remains skipped."
            exit 0
          fi
          if [[ "${RELEASE_RESULT}" != "success" ]]; then
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            echo "release_version=" >> "$GITHUB_OUTPUT"
            echo "Shared release workflow result: ${RELEASE_RESULT}; deployment remains skipped."
            exit 0
          fi
          echo "should_deploy=${SHOULD_DEPLOY}" >> "$GITHUB_OUTPUT"
          echo "release_version=${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: gate
    if: ${{ needs.gate.outputs.should_deploy == 'true' }}
    uses: webpresso/github-actions/.github/workflows/cloudflare-production.yml@2003ca953f336efb779165f748e1ad8408565428
    with:
      install_command: vp install --frozen-lockfile
      verify_command: |
        vp run verify:secrets
        vp run verify:paths
        vp run audit:blueprint-links
        vp run format:check
        vp run check-types
        wp lint
        wp audit docs-frontmatter
        wp audit blueprint-lifecycle
        wp audit architecture-drift --root .
        vp run verify:deploy-contract
        vp run build
        vp run test
        vp exec --filter @edge-matte/e2e -- playwright install --with-deps chromium
        vp run --filter @edge-matte/e2e e2e:run -- --suite upload-delete-contract
        vp run --filter @edge-matte/e2e e2e:run -- --suite smoke
        vp run --filter @edge-matte/e2e e2e:run -- --suite upload-delete
        bash infra/src/deploy/verify-cloudflare-deploy-creds.sh
        if [[ -n "${CF_ACCESS_CLIENT_ID:-}" || -n "${CF_ACCESS_CLIENT_SECRET:-}" ]]; then [[ -n "${CF_ACCESS_CLIENT_ID:-}" && -n "${CF_ACCESS_CLIENT_SECRET:-}" ]]; fi
      deploy_command: bun infra/src/deploy/deploy-production.ts --skip-smoke
      smoke_command: |
        bash infra/src/deploy/wait-for-http.sh "https://edge-matte.ozby.dev/health" 24 5
        bash infra/src/deploy/wait-for-http.sh "https://edge-matte.ozby.dev/" 12 5
        E2E_BASE_URL="https://edge-matte.ozby.dev" E2E_RUN_PRODUCTION=1 vp run e2e -- --suite production-smoke
        E2E_BASE_URL="https://edge-matte.ozby.dev" E2E_RUN_PRODUCTION=1 vp run e2e -- --suite production-journey
      release_version: ${{ needs.gate.outputs.release_version }}
      secret_profile: production
      secret_sink: pulumi
      github_environment: production
      runner: ubuntu-latest
    secrets:
      ci_secret_provider_token: ${{ secrets.CI_SECRET_PROVIDER_TOKEN_PRODUCTION }}
