name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  packages: write
  id-token: write

jobs:
  release:
    uses: webpresso/github-actions/.github/workflows/changesets-release.yml@53869e557de386bd4d04656b275d6691d153bff9
    with:
      install_command: vp install --frozen-lockfile
      version_command: vp run version
      publish_command: vp run release:publish
      runner: ubuntu-latest

  # GitHub Actions does not support referencing a reusable-workflow job's
  # outputs directly in a second reusable-workflow job's `with:` or `if:`.
  # This thin bridge job passes the outputs through a regular job so the
  # deploy call below can consume them without triggering a startup_failure.
  gate:
    needs: release
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ needs.release.outputs.should_deploy }}
      release_version: ${{ needs.release.outputs.release_version }}
    steps:
      - run: "true"

  deploy:
    needs: gate
    if: ${{ needs.gate.outputs.should_deploy == 'true' }}
    uses: webpresso/github-actions/.github/workflows/cloudflare-production.yml@53869e557de386bd4d04656b275d6691d153bff9
    with:
      install_command: vp install --frozen-lockfile
      verify_command: |
        vp run verify:secrets
        vp run verify:paths
        vp run audit:blueprint-links
        vp run format:check
        vp run check-types
        wp lint
        wp audit docs-frontmatter
        wp audit blueprint-lifecycle
        wp audit architecture-drift --root .
        vp run verify:deploy-contract
        vp run build
        vp run test
        vp exec --filter @edge-matte/e2e -- playwright install --with-deps chromium
        pnpm --dir apps/e2e run e2e:run -- --suite upload-delete-contract
        pnpm --dir apps/e2e run e2e:run -- --suite smoke
        pnpm --dir apps/e2e run e2e:run -- --suite upload-delete
        bash infra/src/deploy/verify-cloudflare-deploy-creds.sh
        if [[ -n "${CF_ACCESS_CLIENT_ID:-}" || -n "${CF_ACCESS_CLIENT_SECRET:-}" ]]; then [[ -n "${CF_ACCESS_CLIENT_ID:-}" && -n "${CF_ACCESS_CLIENT_SECRET:-}" ]]; fi
      deploy_command: bun infra/src/deploy/deploy-production.ts --skip-smoke
      smoke_command: |
        bash infra/src/deploy/wait-for-http.sh "https://edge-matte.ozby.dev/health" 24 5
        bash infra/src/deploy/wait-for-http.sh "https://edge-matte.ozby.dev/" 12 5
        E2E_BASE_URL="https://edge-matte.ozby.dev" E2E_RUN_PRODUCTION=1 vp run e2e -- --suite production-smoke
        E2E_BASE_URL="https://edge-matte.ozby.dev" E2E_RUN_PRODUCTION=1 vp run e2e -- --suite production-journey
      release_version: ${{ needs.gate.outputs.release_version }}
      secret_profile: deploy
      runner: ubuntu-latest
    secrets:
      ci_secret_provider_token: ${{ secrets.CI_SECRET_PROVIDER_TOKEN }}
