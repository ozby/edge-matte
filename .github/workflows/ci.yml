name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  # Opt the workflow's JavaScript actions into Node.js 24 ahead of the
  # 2026-06-02 GitHub default switch (replaces the deprecation warning
  # surfaced by actions/checkout@v4, actions/setup-node@v4, and
  # pnpm/action-setup@v4 internally running on Node 20).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  wp-check:
    name: wp-check
    runs-on: ubuntu-latest
    # Baseline CI keeps only stable shared quality gates here; blueprint-lifecycle
    # drift and mutation coverage remain lane-owned follow-up work outside this PR gate.
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - name: Install shared Webpresso CLIs
        shell: bash
        run: |
          set -euo pipefail
          VITE_PLUS_VERSION=$(node -p "require('./package.json').devDependencies['vite-plus'].replace(/^[^0-9]*/, '')")
          AGENT_KIT_VERSION=2.4.1
          npm install -g "vite-plus@${VITE_PLUS_VERSION}" "@webpresso/agent-kit@${AGENT_KIT_VERSION}"
      - run: vp install --frozen-lockfile
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: vp run verify:secrets
      - run: wp audit absolute-path-policy --root .
      - run: wp audit no-first-party-mjs --root .
      - run: wp audit architecture-drift --root .
      - run: vp run audit:secret-provider-quarantine
      - run: vp run audit:blueprint-links
      - run: vp run format:check
      - run: vp run check-types
      - run: vp run lint
      - run: vp run test
      - run: wp audit docs-frontmatter

  e2e:
    # Hermetic end-to-end suite — no secrets, no external network. The local
    # wrangler dev server runs with E2E_MOCK_PIPELINE:1 (deterministic mock
    # provider/transformer), so the full upload -> host -> delete journey,
    # API contract, and browser UI are proven on every PR.
    if: >-
      ${{
        (github.event_name == 'push' &&
          !startsWith(github.event.head_commit.message, 'Version Packages')) ||
        (github.event_name == 'pull_request' &&
          github.event.pull_request.head.ref != 'changeset-release/main')
      }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Install shared Webpresso CLIs
        shell: bash
        run: |
          set -euo pipefail
          VITE_PLUS_VERSION=$(node -p "require('./package.json').devDependencies['vite-plus'].replace(/^[^0-9]*/, '')")
          AGENT_KIT_VERSION=2.4.1
          npm install -g "vite-plus@${VITE_PLUS_VERSION}" "@webpresso/agent-kit@${AGENT_KIT_VERSION}"
      - run: vp install --frozen-lockfile
      - name: Resolve Playwright version
        id: pw
        run: printf 'version=%s\n' "$(node -p "require(\'@playwright/test/package.json\').version")" >> "$GITHUB_OUTPUT"

      - name: Install chromium + system deps
        run: vp exec --filter @edge-matte/e2e -- playwright install --with-deps chromium

      - name: Build client dist
        run: vp run --filter @edge-matte/client build

      # Explicit suites only — never the bare default, which would select
      # production-* because CI === "true".
      - name: Contract (HTTP) suite
        run: vp run --filter @edge-matte/e2e e2e:run -- --suite upload-delete-contract
      - name: Smoke (HTTP) suite
        run: vp run --filter @edge-matte/e2e e2e:run -- --suite smoke
      - name: Browser (Playwright) journey
        run: vp run --filter @edge-matte/e2e e2e:run -- --suite upload-delete

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-artifacts
          path: |
            apps/e2e/playwright-report
            apps/e2e/test-results
          retention-days: 7

  mutation:
    if: ${{ github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'Version Packages') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - name: Install shared Webpresso CLIs
        shell: bash
        run: |
          set -euo pipefail
          VITE_PLUS_VERSION=$(node -p "require('./package.json').devDependencies['vite-plus'].replace(/^[^0-9]*/, '')")
          AGENT_KIT_VERSION=2.4.1
          npm install -g "vite-plus@${VITE_PLUS_VERSION}" "@webpresso/agent-kit@${AGENT_KIT_VERSION}"
      - run: vp install --frozen-lockfile
      - run: wp test --mutation
