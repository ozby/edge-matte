name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Cancel superseded PR runs (stacked pushes on the same PR duplicate the full
# wp-check + e2e run otherwise). Main pushes group by commit SHA instead of
# ref so an in-flight main run is never cancelled by the next push landing
# behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Opt the workflow's JavaScript actions into Node.js 24 ahead of the
  # 2026-06-02 GitHub default switch (replaces the deprecation warning
  # surfaced by actions/checkout@v4, actions/setup-node@v4, and
  # pnpm/action-setup@v4 internally running on Node 20).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  wp-check:
    name: wp-check
    runs-on: ubuntu-latest
    # Baseline CI keeps only stable shared quality gates here; blueprint-lifecycle
    # drift and mutation coverage remain lane-owned follow-up work outside this PR gate.
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@13e7afb99c66525824db54e107d667216e795d37 # v1.14.0
        with:
          node-version: "24.16.0"
          cache: true
          run-install: false
      - uses: webpresso/github-actions/.github/actions/setup-wp@2003ca953f336efb779165f748e1ad8408565428
        with:
          version: "0.0.5"
          package-root: true
      - name: Check workflow action pins
        run: node scripts/check-workflow-action-pins.ts
      - run: vp install --frozen-lockfile
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: vp run verify:secrets
      - run: wp audit absolute-path-policy --root .
      - run: wp audit no-first-party-mjs --root .
      - run: wp audit architecture-drift --root .
      - run: vp run audit:secret-provider-quarantine
      - run: vp run audit:blueprint-links
      - run: vp run format:check
      - run: vp run check-types
      - run: vp run lint
      - name: Run wp audit guardrails
        continue-on-error: true
        run: wp audit guardrails
      - run: vp run test
      - run: wp audit docs-frontmatter

  e2e:
    # Hermetic end-to-end suite — no secrets, no external network. The local
    # wrangler dev server runs with E2E_MOCK_PIPELINE:1 (deterministic mock
    # provider/transformer), so the full upload -> host -> delete journey,
    # API contract, and browser UI are proven on every PR.
    if: >-
      ${{
        (github.event_name == 'push' &&
          !startsWith(github.event.head_commit.message, 'Version Packages')) ||
        (github.event_name == 'pull_request' &&
          github.event.pull_request.head.ref != 'changeset-release/main')
      }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: voidzero-dev/setup-vp@13e7afb99c66525824db54e107d667216e795d37 # v1.14.0
        with:
          node-version: "24.16.0"
          cache: true
          run-install: false
      - uses: webpresso/github-actions/.github/actions/setup-wp@2003ca953f336efb779165f748e1ad8408565428
        with:
          version: "0.0.5"
          package-root: true
      - run: vp install --frozen-lockfile
      - name: Resolve Playwright version
        id: pw
        run: printf 'version=%s\n' "$(node -p "require(\'@playwright/test/package.json\').version")" >> "$GITHUB_OUTPUT"

      - name: Install chromium + system deps
        run: vp exec --filter @edge-matte/e2e -- playwright install --with-deps chromium

      - name: Build client dist
        run: vp run --filter @edge-matte/client build

      # Explicit suites only — never the bare default, which would select
      # production-* because CI === "true".
      - name: Contract (HTTP) suite
        run: vp run --filter @edge-matte/e2e e2e:run -- --suite upload-delete-contract
      - name: Smoke (HTTP) suite
        run: vp run --filter @edge-matte/e2e e2e:run -- --suite smoke
      - name: Browser (Playwright) journey
        run: vp run --filter @edge-matte/e2e e2e:run -- --suite upload-delete

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-artifacts
          path: |
            apps/e2e/playwright-report
            apps/e2e/test-results
          retention-days: 7
