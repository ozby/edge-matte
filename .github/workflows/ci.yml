name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  ci:
    uses: webpresso/github-actions/.github/workflows/webpresso-ci.yml@5cd210dadf5cd0c04ccfaf3e10025efd7dbd6439
    with:
      install_command: vp install --frozen-lockfile
      quality_command: |
        vp run verify:secrets
        wp audit absolute-path-policy --root .
        wp audit no-first-party-mjs --root .
        vp run audit:secret-provider-quarantine
        vp run audit:blueprint-links
        vp run format:check
        vp run check-types
        vp run lint
        vp run test
        wp audit docs-frontmatter
        BASE="${{ github.base_ref || 'main' }}"
        git fetch origin "$BASE" --depth=50 2>/dev/null || true
        COMMITS=$(git rev-list --no-merges "origin/$BASE..HEAD" 2>/dev/null || true)
        if [ -n "$COMMITS" ]; then
          FAIL=0
          for SHA in $COMMITS; do
            SUBJECT=$(git log -1 --format="%s" "$SHA")
            if [ "$SUBJECT" = "Version Packages" ]; then
              continue
            fi
            git log -1 --format="%B" "$SHA" > /tmp/commit-msg.txt
            WP_SKIP_UPDATE_CHECK=1 vp exec wp audit commit-message --require-lore --message-file /tmp/commit-msg.txt || FAIL=1
          done
          test "$FAIL" -eq 0
        fi
      e2e_command: |
        vp exec --filter @edge-matte/e2e -- playwright install --with-deps chromium
        vp run --filter @edge-matte/client build
        pnpm --dir apps/e2e run e2e:run -- --suite upload-delete-contract
        pnpm --dir apps/e2e run e2e:run -- --suite smoke
        pnpm --dir apps/e2e run e2e:run -- --suite upload-delete
      architecture_command: wp audit architecture-drift --root .
      runner: ubuntu-latest

  mutation:
    if: ${{ github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'Version Packages') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - uses: webpresso/github-actions/.github/actions/setup-webpresso-toolchain@5cd210dadf5cd0c04ccfaf3e10025efd7dbd6439
      - name: Install CLI globals at pinned versions
        run: |
          set -euo pipefail
          specs="$(node -e "
          const pkg = require('./package.json');
          const all = { ...pkg.dependencies, ...pkg.devDependencies };
          const names = ['vite-plus', '@webpresso/agent-kit'];
          const out = names
            .map(n => { const v = all[n]; return v && !v.startsWith('catalog:') && !v.startsWith('workspace:') && !v.startsWith('link:') ? n + '@' + v : null; })
            .filter(Boolean);
          process.stdout.write(out.join(' '));
          ")"
          if [[ -n "${specs}" ]]; then
            echo "Installing: ${specs}"
            npm install -g ${specs}
          fi
      - run: vp install --frozen-lockfile
      - run: wp test --mutation

  deploy-preview:
    name: Deploy preview (PR)
    if: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' && github.head_ref != 'changeset-release/main' }}
    needs: ci
    concurrency:
      group: edge-matte-preview-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    uses: webpresso/github-actions/.github/workflows/cloudflare-preview.yml@5cd210dadf5cd0c04ccfaf3e10025efd7dbd6439
    with:
      lane: preview_pr_${{ github.event.pull_request.number }}
      mode: deploy
      install_command: vp install --frozen-lockfile
      verify_command: ":"
      deploy_command: bun infra/src/deploy/deploy-preview.ts --lane preview-pr-${{ github.event.pull_request.number }}
      runner: ubuntu-latest
    secrets:
      ci_secret_provider_token: ${{ secrets.CI_SECRET_PROVIDER_TOKEN }}
