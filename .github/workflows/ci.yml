name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  # Opt the workflow's JavaScript actions into Node.js 24 ahead of the
  # 2026-06-02 GitHub default switch (replaces the deprecation warning
  # surfaced by actions/checkout@v4, actions/setup-node@v4, and
  # pnpm/action-setup@v4 internally running on Node 20).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  HAS_DOPPLER_TOKEN: ${{ (secrets.DOPPLER_SERVICE_TOKEN != '' || secrets.DOPPLER_TOKEN != '') && '1' || '' }}

jobs:
  wp-check:
    name: wp-check
    runs-on: ubuntu-latest
    # Baseline CI keeps only stable shared quality gates here; blueprint-lifecycle
    # drift and mutation coverage remain lane-owned follow-up work outside this PR gate.
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ac6db6d3c1f721f886538a378a2d73e85697340a # v6
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24.16.0"
          cache: pnpm
      - name: Set up Webpresso tooling
        uses: ./.github/actions/setup-webpresso
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - run: vp install --frozen-lockfile
      - run: vp run verify:secrets
      - run: wp audit absolute-path-policy --root .
      - run: wp audit no-first-party-mjs --root .
      - run: vp run audit:secret-provider-quarantine
      - run: vp run audit:blueprint-links
      - run: vp run format:check
      - run: vp run check-types
      - run: vp run lint
      - run: pnpm test
      - run: wp audit docs-frontmatter

      - name: Validate Lore commits
        run: |
          BASE=${{ github.base_ref || 'main' }}
          git fetch origin "$BASE" --depth=50 2>/dev/null || true
          COMMITS=$(git rev-list --no-merges "origin/$BASE..HEAD" 2>/dev/null || true)
          if [ -z "$COMMITS" ]; then
            echo "No branch commits to validate."
            exit 0
          fi
          FAIL=0
          for SHA in $COMMITS; do
            git log -1 --format="%B" "$SHA" > /tmp/commit-msg.txt
            WP_SKIP_UPDATE_CHECK=1 wp audit commit-message --require-lore --message-file /tmp/commit-msg.txt || FAIL=1
          done
          exit $FAIL

  e2e:
    # Hermetic end-to-end suite — no secrets, no external network. The local
    # wrangler dev server runs with E2E_MOCK_PIPELINE:1 (deterministic mock
    # provider/transformer), so the full upload -> host -> delete journey,
    # API contract, and browser UI are proven on every PR.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: pnpm/action-setup@ac6db6d3c1f721f886538a378a2d73e85697340a # v6
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24.16.0"
          cache: pnpm
      - name: Set up Webpresso tooling
        uses: ./.github/actions/setup-webpresso
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - run: vp install --frozen-lockfile

      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Install chromium + system deps
        run: vp exec --filter @edge-matte/e2e -- playwright install --with-deps chromium

      - name: Build client dist
        run: vp run --filter @edge-matte/client build

      # Explicit suites only — never the bare default, which would select
      # production-* because CI === "true".
      - name: Contract (HTTP) suite
        run: vp run e2e -- --suite upload-delete-contract
      - name: Smoke (HTTP) suite
        run: vp run e2e -- --suite smoke
      - name: Browser (Playwright) journey
        run: vp run e2e -- --suite upload-delete

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-artifacts
          path: |
            apps/e2e/playwright-report
            apps/e2e/test-results
          retention-days: 7

  mutation:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ac6db6d3c1f721f886538a378a2d73e85697340a # v6
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24.16.0"
          cache: pnpm
      - name: Set up Webpresso tooling
        uses: ./.github/actions/setup-webpresso
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - run: vp install --frozen-lockfile
      - run: pnpm run mutation
