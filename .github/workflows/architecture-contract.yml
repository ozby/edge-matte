name: architecture-contract

on:
  pull_request:
  push:
    branches: [main]

jobs:
  architecture-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: "24.16.0"
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install global Webpresso tooling
        run: npm install -g vite-plus@0.1.22 @webpresso/agent-kit@0.21.5
      - name: Check architecture drift contract
        run: wp audit architecture-drift --root .
