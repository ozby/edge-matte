name: architecture-contract

on:
  pull_request:
  push:
    branches: [main]

jobs:
  architecture-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install global Webpresso tooling
        run: bun add -g webpresso vite-plus
      - name: Check architecture drift contract
        run: python3 scripts/check_architecture_drift.py
