name = "edge-matte"
account_id = "e93986039ea9bd9729fa534a29e9e88f" # ozby account — public identifier; matches ingest-lens
main = "src/index.ts"
compatibility_date = "2025-12-10"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "../client/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Force every request through the Worker so the security-headers middleware
# applies to SPA shell responses, not just /api routes.
run_worker_first = true

[images]
binding = "IMAGES"

[[r2_buckets]]
binding = "IMAGES_BUCKET"
bucket_name = "edge-matte-images"

[vars]
APP_ORIGIN = "https://edge-matte.ozby.dev"

[env.production]
name = "edge-matte"
workers_dev = false

[[env.production.routes]]
pattern = "edge-matte.ozby.dev"
custom_domain = true

[env.production.vars]
APP_ORIGIN = "https://edge-matte.ozby.dev"

[env.production.assets]
directory = "../client/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[env.production.images]
binding = "IMAGES"

[[env.production.r2_buckets]]
binding = "IMAGES_BUCKET"
bucket_name = "edge-matte-images"
