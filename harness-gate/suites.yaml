version: 1
consumer: edge-matte
suites:
  - id: edge-matte.agent-setup-smoke
    tier: held-in
    command: wp setup --check
    surfaces:
      - generated-agent-surfaces
      - codex-hooks
      - claude-hooks
    proof: validates that generated agent surfaces and hook install checks remain consumable in edge-matte
  - id: edge-matte.e2e-smoke
    tier: held-in
    command: wp e2e --suite smoke
    surfaces:
      - harness-regression-gate
    proof: validates baseline Playwright smoke wiring through the wp e2e adapter
  - id: edge-matte.worker-contract
    tier: held-out
    command: vp run test -- test/agent-kit-deploy-adapter.test.ts
    surfaces:
      - harness-regression-gate
      - generated-agent-surfaces
    proof: validates agent-kit deploy adapter expectations as a stronger held-out consumer check
